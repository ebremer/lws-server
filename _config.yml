# Jekyll + Just the Docs configuration for the LWS Server documentation site.
title: LWS Server
description: >-
  A W3C Linked Web Storage (LWS) Protocol server — plain Jakarta servlets on embedded Jetty,
  Apache Jena/TDB2 storage, four authentication suites, WAC, notifications, search and more.
lang: en

# Theme (built by the included GitHub Actions workflow with Jekyll 4 and the just-the-docs gem).
theme: just-the-docs

# url/baseurl are injected by the Pages workflow (actions/configure-pages); leave unset for local
# preview at http://localhost:4000/. If you instead deploy from a branch, set baseurl to your
# project-page path, e.g. baseurl: "/lws-server-docs".

plugins:
  - jekyll-relative-links   # lets inline links to other .md files resolve on the built site

# ----- Just the Docs options -----
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true
color_scheme: light

# Link shown at the top-right of every page. Update if your repository lives elsewhere.
aux_links:
  "Source on GitHub":
    - "https://github.com/ebremer/lws-server"
aux_links_new_tab: true

# Callouts (used as {: .warning } / {: .note } on blockquotes)
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

# Footer
back_to_top: true
back_to_top_text: "Back to top"
last_edit_timestamp: false

# jekyll-relative-links needs these files left alone by the converter
relative_links:
  enabled: true
  collections: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
