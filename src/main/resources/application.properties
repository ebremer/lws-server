# Spring Boot is used only to start embedded Jetty; keep this file minimal.
spring.application.name=lws-server
spring.main.banner-mode=off
# The HTTP port is set programmatically from lws.base-uri (see LwsServletConfig); this is only a fallback.
server.port=8080
logging.level.com.ebremer.lws=INFO
logging.level.org.eclipse.jetty=INFO
