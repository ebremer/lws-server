# Spring Boot is used only to start embedded Jetty; keep this file minimal.
spring.application.name=lws-server
spring.main.banner-mode=off
# The HTTP port is set programmatically from lws.base-uri (see LwsServletConfig); this is only a fallback.
server.port=8080
logging.level.com.ebremer.lws=INFO
logging.level.org.eclipse.jetty=INFO

# Session cookie hardening for the /app console (the bare-Jetty launcher sets the same in code).
# SameSite=strict keeps the cookie off cross-site requests entirely, behind Wicket's
# resource-isolation listener; http-only keeps it away from script. 'secure' is deliberately NOT
# forced here because the Spring entry point is also used over plain HTTP in development.
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
