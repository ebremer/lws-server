# Jekyll + Just the Docs configuration for the LWS Server documentation site.
title: LWS Server
description: >-
  A W3C Linked Web Storage (LWS) Protocol server — plain Jakarta servlets on embedded Jetty,
  Apache Jena/TDB2 storage, four authentication suites, WAC, notifications, search and more.
lang: en

# Theme: Just the Docs pulled via remote_theme, pinned to a version compatible with GitHub Pages'
# classic build (the "Deploy from a branch" source, which runs Jekyll 3.10 via the github-pages gem).
remote_theme: just-the-docs/just-the-docs@v0.5.4

# baseurl is the path the site is served under. For a project page at
# https://<user>.github.io/lws-server-docs/ keep "/lws-server-docs". For a user/org page or a custom
# domain set it to "". For local preview: bundle exec jekyll serve --baseurl ""
baseurl: "/lws-server-docs"

plugins:
  - jekyll-remote-theme
  - jekyll-relative-links   # lets inline links to other .md files resolve on the built site

# ----- Just the Docs options -----
search_enabled: true
search:
  heading_level: 3
  previews: 3
heading_anchors: true
color_scheme: light

# Link shown at the top-right of every page. Update if your repository lives elsewhere.
aux_links:
  "Source on GitHub":
    - "https://github.com/ebremer/lws-server"
aux_links_new_tab: true

# Callouts (used as {: .warning } / {: .note } on blockquotes)
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red

# Footer
back_to_top: true
back_to_top_text: "Back to top"
last_edit_timestamp: false

# jekyll-relative-links needs these files left alone by the converter
relative_links:
  enabled: true
  collections: false

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .github
