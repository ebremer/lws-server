# Example LWS server configuration.
# Copy to "lws.properties" (working directory or classpath) or pass any key as -Dlws.<key>=<value>.
# Precedence (low -> high): built-in defaults < classpath lws.properties < ./lws.properties < -Dlws.*

# Public base IRI of this storage. Also determines the HTTP listen port.
# In production this is the EXTERNAL https:// URL; the server itself serves plain HTTP and expects a
# reverse proxy to terminate TLS (DPoP and WebID/OIDC assume TLS). DPoP htu and all minted IRIs are
# built from this value, not from the (internal) request scheme/host.
lws.base-uri=http://localhost:8080

# Running behind a TLS-terminating reverse proxy: trust X-Forwarded-* / Forwarded (RFC 7239) from it
# so the request scheme/host and isSecure() reflect the external HTTPS URL (affects secure-cookie
# flags and generated redirects). Leave false unless a trusted proxy sits in front (else a client
# could spoof the scheme). The proxy MUST set X-Forwarded-Proto/Host and not pass client-supplied ones.
lws.behind-proxy=false

# Refuse to start if lws.base-uri is not https:// (loopback hosts are exempt for local development).
# Recommended in production to catch a misconfigured, TLS-less deployment.
lws.require-https=false

# Strict-Transport-Security lifetime, in seconds (default one year; 0 sends no header). Emitted only
# on responses that actually went out over TLS - directly, or through a proxy when
# lws.behind-proxy=true - and only when lws.base-uri is https, because telling a browser to use HTTPS
# for a host this server only serves in plaintext would make the storage unreachable.
# includeSubDomains and preload are deliberately not sent: both commit names other than this one.
# lws.hsts.max-age-seconds=31536000

# --- Direct TLS termination via ACME (Let's Encrypt) -------------------------------------------
# An ALTERNATIVE to the reverse-proxy model above: the bare-Jetty launcher
# (com.ebremer.lws.server.JettyLauncher) obtains and renews a certificate via acme4j + the HTTP-01
# challenge and serves HTTPS itself. Use this OR the proxy, not both. Requires ports 80 and 443 to be
# publicly reachable. See README -> "Terminating TLS in the server (ACME / Let's Encrypt)".
lws.tls.enabled=false
# HTTPS port, and the HTTP port that serves the ACME challenge and redirects to HTTPS.
lws.tls.port=443
lws.tls.http-port=80
# Contact email for the ACME account (recommended; expiry notices).
lws.tls.acme.email=
# MUST be true to register an ACME account — it agrees to the CA's Terms of Service.
lws.tls.acme.accept-terms-of-service=false
# Domain(s) to certify (space/comma separated). Defaults to the host of lws.base-uri.
lws.tls.acme.domains=
# ACME directory URL. Default is Let's Encrypt PRODUCTION. While testing, use staging to avoid rate
# limits (staging certs are NOT browser-trusted):
#   https://acme-staging-v02.api.letsencrypt.org/directory
lws.tls.acme.directory-url=https://acme-v02.api.letsencrypt.org/directory
# Renew when the certificate is within this many days of expiry.
lws.tls.acme.renew-before-days=30
# Directory for the ACME account key, domain key and certificate chain (default: <data-dir>/tls).
#lws.tls.dir=lws-data/tls

# Directory holding the TDB2 dataset, binary blobs and webhook signing keys.
lws.data-dir=lws-data

# NOTE FOR OPERATORS: the two directories that hold private keys - <data-dir>/keys (the webhook
# signing seed) and the TLS directory below (the ACME account key and the TLS domain key) - are
# created OWNER-ONLY, and an existing one is tightened to owner-only at startup. That is a change of
# permissions on a directory you may have created yourself. Point lws.tls.dir somewhere private if
# you had it sharing a directory with anything another account needs to read.

# Path prefix for server-managed system resources (storage description, subscriptions, jwks).
lws.system-prefix=.lws

# Storage owners (space/comma separated WebIDs). AT LEAST ONE IS REQUIRED: an empty value is open
# mode, where every read, write and control decision is permitted for every client including
# anonymous ones, and the server refuses to start that way unless lws.dev.open=true.
# To bootstrap the first owner offline (no identity provider), mint a self-signed did:key with:
#   java -cp target/lws-server.jar -Dloader.main=com.ebremer.lws.server.tools.DidKeyTool org.springframework.boot.loader.launch.PropertiesLauncher
#   (or from a source checkout:  mvn -q exec:java -Dexec.mainClass=com.ebremer.lws.server.tools.DidKeyTool)
# then paste the printed did:key below and use the printed Bearer token to authenticate.
lws.owners=

# Permit the development-only postures: an empty lws.owners (open mode), and lws.ui.dev-login on a
# non-loopback base URI. INSECURE - development only. Refused together with lws.require-https=true
# (a development authorization posture and a production transport posture cannot both be true), and
# warned about together with lws.behind-proxy=true or a non-loopback base URI.
lws.dev.open=false

# Whether agents who are neither an owner nor otherwise authorized may read the storage. This is
# STORAGE-WIDE: there is no per-resource public-read flag. To open one resource, or one subtree, to
# the world, issue an access grant with assignee http://xmlns.com/foaf/0.1/Agent and a target value
# naming it (a value ending in "/" covers the subtree); deleting the grant closes it again.
# In WAC mode this decides whether the bootstrapped root ACL carries a public acl:Read.
lws.public-read=false

# Authorization model:
#   OWNER - single-tenant: owners (above) have full control; others get public-read only.
#   WAC   - Web Access Control: multi-user, per-resource .acl resources (acl:agent / acl:agentClass,
#           acl:mode Read/Write/Append/Control) with container inheritance via acl:default.
# In WAC mode a root ACL is bootstrapped from lws.owners. With none set (which needs lws.dev.open)
# it is opened to the public instead; that development ACL is marked as such and is REBUILT from
# lws.owners the first time the server starts with owners configured. A root ACL you wrote yourself
# carries no such mark and is never rebuilt.
lws.access-control=OWNER

# WAC only: acl:agentGroup membership is resolved by dereferencing the group document, whose address
# comes out of the requester's own ACL. These bound that egress.
#   group-cache-seconds            how long a resolved membership set is reused; must be > 0,
#                                 because a decision made inside a storage transaction resolves
#                                 membership from this cache alone
#   group-failure-cache-seconds    how long a group document that could not be resolved is left
#                                  alone before another attempt; kept short so a transient outage
#                                  clears in seconds, but long enough that an unreachable address
#                                  is not re-fetched on every request
#   max-group-fetches-per-decision how many group documents one authorization decision may fetch;
#                                  beyond this, unresolved groups simply do not match
# lws.wac.group-cache-seconds=300
# lws.wac.group-failure-cache-seconds=30
# lws.wac.max-group-fetches-per-decision=8

# ----- Metadata store backend -----
# TDB2 (default, embedded) or REMOTE (any SPARQL 1.1 service: Query + Update + Graph Store Protocol).
lws.sparql.mode=TDB2
# All three are REQUIRED when mode=REMOTE, and each must be an absolute http(s) URL; the server
# refuses to start otherwise rather than failing later with an opaque Jena error naming no key.
# They are operator-configured, so they are NOT subject to the lws.fetch.* SSRF guard - a private
# address like the one below is the normal case.
# lws.sparql.mode=REMOTE
# lws.sparql.query=http://localhost:3030/lws/query
# lws.sparql.update=http://localhost:3030/lws/update
# lws.sparql.gsp=http://localhost:3030/lws/data
#
# REMOTE is EXPERIMENTAL and refused unless this is set. Remote SPARQL has no cross-statement
# transaction, so a unit of work is a sequence of independent requests that nothing rolls back:
# conditional writes (If-Match) stop being a compare-and-swap and a lost update becomes possible
# again; a delete no longer erases the resource's ACL and linkset atomically with it, so a path
# re-created afterwards can inherit the old ACL; binary content and its metadata can diverge; the
# linkset read-modify-write and the storage quota become advisory; and two concurrent POSTs with the
# same Slug can pick the same name. The default TDB2 backend has none of these properties.
# lws.sparql.remote.accept-no-transactions=false

# ----- Optional interactive OpenID Connect login for the Wicket UI -----
# (Resource-server token validation does NOT need these.)
# lws.oidc.discovery-uri=https://issuer.example.org/.well-known/openid-configuration
# lws.oidc.client-id=your-client-id
# lws.oidc.client-secret=your-client-secret

# ----- Wicket management UI -----
# Enable a developer sign-in form in the UI that lets you act as any WebID (impersonation).
# INSECURE - development/administration only. Leave false in any shared/production deployment;
# users should sign in with an OIDC ID token instead. Refused at startup when lws.base-uri is not
# loopback (unless lws.dev.open=true), and refused per request from a non-loopback client or whenever
# lws.behind-proxy=true, since a fronting proxy makes the client address caller-supplied.
lws.ui.dev-login=false

# ----- SAML 2.0 authentication suite (out-of-band trust) -----
# Trust is established by configuring the IdP's signing certificate(s); without these the SAML
# suite is inactive. (OpenID, SSI-CID and did:key need no configuration — they self-describe.)
# lws.saml.idp-certificates=/etc/lws/idp1.pem,/etc/lws/idp2.pem
# lws.saml.trusted-issuers=https://idp.example/entity
# lws.saml.audience=http://localhost:8080

# ----- Webhook delivery tuning -----
lws.webhook.max-attempts=5
lws.webhook.retry-backoff-ms=2000
lws.webhook.max-consecutive-failures=10

# Delivery worker threads, how many deliveries may wait for one, and how many may be in flight to a
# single inbox host at a time. The queue is bounded and the per-host cap exists so that one slow or
# unresponsive subscriber cannot occupy the pool and stall notifications for everybody else;
# deliveries beyond either limit are dropped with a warning rather than queued indefinitely.
lws.webhook.threads=4
lws.webhook.queue-capacity=1000
lws.webhook.max-in-flight-per-host=4

# How often expired subscriptions are purged, in seconds (0 disables).
lws.subscription.purge-interval-seconds=3600

# ----- Notification delivery SSRF guard -----
# A subscription's 'inbox' (and the 'inbox' on an access request/grant) is client-supplied, and the
# server POSTs signed notifications to it. Without a guard that makes the server an on-demand
# request-forgery tool against its own network, with the delivery outcome as the readable result.
# By default non-http(s) inboxes are refused, as are hosts resolving to loopback, private,
# link-local (incl. 169.254.169.254), wildcard or multicast addresses. Inboxes are checked when the
# subscription/request is created (a 400) and again before every delivery attempt.
# Kept separate from lws.fetch.* on purpose: being willing to dereference an internal IdP is a
# different decision from being willing to POST notifications at an internal address.
# lws.webhook.block-private-addresses=true
# Hosts (space/comma separated) permitted as inboxes despite that block — e.g. an internal consumer:
# lws.webhook.allowed-hosts=inbox.internal.example

# ----- Subscription limits -----
# Whether an unauthenticated client may create a subscription. Off by default: an anonymous
# subscriber cannot be held to a quota, cannot manage what it created (there is no WebID to match
# against), and can aim the server's signed deliveries at any permitted inbox.
lws.subscriptions.allow-anonymous=false
# Maximum subscriptions one subscriber may hold; further creates get 429.
lws.subscriptions.max-per-subscriber=100
# Maximum (and default) subscription lifetime in seconds — 30 days. A subscription that never
# expires is never reclaimed, and every one of them is re-read and re-matched on every write.
# 0 imposes no expiry (not recommended).
lws.subscriptions.max-lifetime-seconds=2592000

# ----- Type Index / Type Search services (lws10-searchindex) -----
# Advertise (in the storage description) and serve the server-managed Type Index and Type Search
# endpoints. Responses are always authorization-filtered for the requesting client.
lws.search-index.enabled=true
# Maximum number of items per Type Index / Type Search response page.
lws.search-index.page-size=100

# Maximum number of members per container-listing page. A container whose membership exceeds this
# is returned in pages (Link rel=first/prev/next/last, ?page=N); smaller listings are returned whole.
lws.container.page-size=1000

# ----- Access Requests & Grants (lws10-core/lws-access-requests) -----
# Advertise and serve the AccessRequestService + AccessGrantService endpoints. A grant issued by a
# storage controller authorizes the named agent for the granted actions/targets (enforced on top of
# the base authorization model); revoking the grant withdraws the access.
lws.access-requests.enabled=true
# Optional inbox to notify when a new access request is created (the storage controller's inbox).
# lws.access-requests.controller-inbox=https://controller.example/inbox

# ----- Storage quota -----
# Maximum total bytes of binary (non-RDF) content the storage will hold; a write that would exceed
# it is refused with 507 Insufficient Storage. 0 (the default) means unlimited.
lws.quota.max-bytes=0

# ----- Cross-origin access (CORS) -----
# Web origins allowed to call this storage's HTTP API from a browser (space/comma separated).
# EMPTY (the default) means no cross-origin access: no Access-Control-* header is ever sent, and a
# browser application served from another origin cannot read anything here. Because the API
# authenticates with an Authorization header, every authenticated cross-origin request is preceded by
# a preflight, so nothing works from a browser until an origin is listed.
#
# Access-Control-Allow-Credentials is NEVER sent. The API authenticates with a bearer/DPoP token the
# script supplies itself, never with an ambient cookie, so an allowed origin can only reach this
# storage with a token it already holds - and the management console's session cookie cannot be
# borrowed. The /app and /callback trees are excluded from CORS outright as well.
#
# "*" allows any origin. It is legal here only because credentials are never sent, and the server
# REFUSES to start with it in open mode (no lws.owners): open mode authorizes every request, so "*"
# would let any website a browser visits read and write the whole storage with no credential at all.
# lws.cors.allowed-origins=https://app.example, http://localhost:5173
#
# How long a browser may cache the preflight result, in seconds.
# lws.cors.max-age-seconds=600

# ----- Request limits -----
# Maximum accepted request-body size in bytes (default 64 MiB; 0 disables the limit). Bodies are
# buffered whole before the write is authorized, so without a bound an unauthenticated client can
# cost the server arbitrary heap; over-sized requests are refused with 413.
lws.max-request-bytes=67108864
#
# Maximum serialized size, in bytes, of the user-managed part of one resource's linkset (its
# `.meta` document). Unlike a request body this grows by composition: a PATCH is applied to what is
# already stored, so many individually small, individually authorized patches can compose into a
# document no reader can parse and no heap can hold. A write whose RESULT would exceed this is
# refused with 400. The nesting bound that goes with it (64 levels) is fixed and is applied to the
# result for the same reason.
lws.linkset.max-bytes=1048576

# ----- Credential audience binding -----
# Which 'aud' values a JWT credential may carry. Binding credentials to an audience is what stops a
# token presented to this storage being replayed against another one, and stops an OpenID ID token
# minted for a different relying party of the same provider authenticating here.
# Defaults to this storage's own IRIs (lws.base-uri, with and without a trailing slash). Set it
# explicitly when your provider mints a different value -- e.g. an OAuth client id.
# lws.audience=lws-client, https://storage.example
#
# Whether a credential must carry an 'aud' claim at all. Default true.
# A credential whose 'aud' is present but names something else is ALWAYS refused, whatever this is
# set to; this switch only decides whether an absent 'aud' is tolerated. Set it to false for
# interoperability with clients that do not send one -- note that this reopens cross-storage replay.
lws.audience.require=true

# Longest lifetime (exp - iat) accepted for a *self-signed* credential (the did:key and SSI-CID
# suites), in seconds. Those tokens are minted by their holder, so without a bound one leak is a
# permanent, unrevocable credential. 0 means unlimited. Default 3600.
lws.token.max-lifetime-seconds=3600

# ----- DPoP -----
# Require a server-issued nonce in DPoP proofs (RFC 9449 §8). When true, a DPoP request without a
# valid nonce is answered 401 with a DPoP-Nonce header and 'WWW-Authenticate: DPoP error=use_dpop_nonce';
# the client retries with that nonce in the proof. Default false.
lws.dpop.require-nonce=false

# Refuse plain 'Authorization: Bearer' entirely, so every request must be DPoP-bound. Default false.
# Independently of this setting, a DPoP-bound access token (one carrying a cnf.jkt confirmation
# claim) is always refused under the Bearer scheme, as RFC 9449 §7.1 requires.
lws.dpop.require=false

# How many DPoP proof identifiers (jti) the replay guard remembers. An entry lives for the whole
# window in which its proof is still acceptable - iat may be up to 5 minutes old or 1 minute in the
# future, so SIX minutes - and an entry evicted because the cache is FULL has not expired: the proof
# that wrote it becomes replayable again. Size this above the number of DPoP requests expected in six
# minutes. The server logs a warning (at most once a minute) when eviction starts.
#
# A jti is recorded only after the request's access token has validated and been found bound to the
# proof key, so an unauthenticated client cannot fill the cache. That is a bound on the cost, not an
# impossibility: did:key credentials are self-issued and free to mint offline, so a party willing to
# hold one can still fill it at the price of a full request each. Size accordingly.
# lws.dpop.jti-cache-size=100000

# ----- Self-signed Controlled Identifier (SSI-CID) suite -----
# An SSI-CID credential is presented by an unauthenticated client and names the subject URL this
# server must dereference to find the verification key. These bound that egress: without them one
# request in produced one outbound request to an address of the caller's choosing, as fast as the
# caller could send. The positive TTL is the window in which a ROTATED OR REVOKED key stays
# honoured, so keep it short; the failure TTL is shorter still, so an unreachable subject is not
# re-fetched per request while a real outage clears in seconds.
# lws.ssi-cid.document-cache-seconds=300
# lws.ssi-cid.document-failure-cache-seconds=30

# ----- SPARQL Update (PATCH) hardening -----
# A SPARQL Update LOAD/SERVICE makes the server fetch a URL (an SSRF risk). These are blocked unless
# the target host is listed here (space/comma separated). Empty (the default) blocks them entirely;
# ordinary INSERT/DELETE updates are unaffected.
# lws.sparql-update.allowed-hosts=data.trusted.example, vocab.trusted.example

# ----- Outbound-fetch (auth + WAC) SSRF guard -----
# During authentication the server dereferences URLs taken from untrusted token claims (the WebID/CID
# 'sub', the OIDC issuer 'iss' and its JWKS) and WAC dereferences acl:agentGroup documents. By default
# non-http(s) schemes (e.g. file://) are refused and hosts resolving to loopback, private, link-local
# (incl. the cloud-metadata 169.254.169.254), wildcard or multicast addresses are blocked.
# Set false ONLY on a trusted network or for local development (e.g. a loopback identity provider):
# lws.fetch.block-private-addresses=true
# Hosts (space/comma separated) exempt from the private-address block — e.g. an internal IdP:
# lws.fetch.allowed-hosts=idp.internal.example

# ----- JSON-LD remote contexts -----
# A JSON-LD body chooses its own @context, and resolving one makes the server fetch a URL the
# document picked — an SSRF and local-file-read surface on every RDF write. Remote contexts are
# therefore refused entirely by default; an inline @context object works unchanged.
# List hosts here (space/comma separated) to permit their published vocabularies. Permitted fetches
# are https-only, size-capped and time-bounded, and redirects are not followed.
# lws.jsonld.allowed-context-hosts=www.w3.org, schema.org

# ----- Embedded SPARQL endpoint (Apache Jena Fuseki) -----
# Expose a SPARQL endpoint over the live TDB2 dataset (only when lws.sparql.mode=TDB2). It runs as
# an embedded Fuseki on its own port. WARNING: it bypasses WAC/owner authorization and exposes ALL
# graphs (including internal admin/ACL/grant metadata) — keep it loopback-only or behind trusted
# auth. Disabled by default; query-only and loopback-only when enabled.
#   Query: http://<host>:<port>/<dataset>/sparql
lws.sparql.endpoint.enabled=false
lws.sparql.endpoint.port=3030
lws.sparql.endpoint.dataset=lws
lws.sparql.endpoint.read-only=true
lws.sparql.endpoint.loopback=true
# When enabled, the endpoint is advertised in the storage description (as a W3C SPARQL Service
# Description service). Set the publicly reachable query URL here (e.g. a reverse-proxied address);
# if left empty it is derived from the base host, port and dataset.
# lws.sparql.endpoint.public-url=https://storage.example/sparql

# ----- Existence disclosure -----
# A resource is looked up before the authorization decision is made, so a client that may not read
# it could once tell a resource that exists (403) from one that does not (404). With this on, an
# AUTHENTICATED principal without Read is answered 404 in both cases, and the Allow header on
# OPTIONS and 405 stops reporting the type of a resource they may not read.
#
# An ANONYMOUS client still gets 401, deliberately: it has to be told that authenticating is what
# it is missing, or it can never discover how to sign in. Note also that under Web Access Control
# the anonymous 401/404 split still discriminates by where ACLs sit, which no status-code masking
# can fix -- see the note on ResourceService.denied.
lws.mask-forbidden-as-not-found=true
